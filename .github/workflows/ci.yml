name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build PackCheck.sln -c Release
      - name: Test
        run: dotnet test tests/PackCheck.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: CLI smoke test
        shell: pwsh
        run: |
          dotnet run --project src/PackCheck.Cli -c Release --no-build -- version
          dotnet run --project src/PackCheck.Cli -c Release --no-build -- doctor
