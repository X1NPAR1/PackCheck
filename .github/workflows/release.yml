name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Set to "true" only while 1.x clients (zip-only updater) still need a bridge package.
      BRIDGE_ZIP: ${{ startsWith(github.ref_name, 'v3.1.') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Test
        run: dotnet test tests/PackCheck.Tests -c Release --filter "Category!=Network&Category!=EndToEnd"

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/PackCheck.App -c Release -r win-x64 --self-contained true -p:Version=$version -p:InformationalVersion=$version -o publish/PackCheck
          dotnet publish src/PackCheck.UpdateHelper -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -o publish/helper
          Copy-Item publish/helper/PackCheck.UpdateHelper.exe publish/PackCheck/
          dotnet publish src/PackCheck.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -o publish/cli

      - name: Build installers
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python tools/license_rtf.py
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer/PackCheck.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Push-Location installer
          wix build PackCheck.wxs -ext WixToolset.UI.wixext -arch x64 -d "Version=$version" -d "SourceDir=..\publish\PackCheck" -o "..\artifacts\PackCheck-$version.msi"
          if ($LASTEXITCODE -ne 0) { throw "WiX failed" }
          Pop-Location
          Remove-Item artifacts/*.wixpdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/cli/packcheck.exe -DestinationPath artifacts/packcheck-cli-win-x64.zip
          if ($env:BRIDGE_ZIP -eq 'true') {
            Compress-Archive -Path publish/PackCheck/* -DestinationPath artifacts/PackCheck-win-x64.zip
          }
          Get-ChildItem artifacts -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }
          Get-ChildItem artifacts

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "release-notes/${{ github.ref_name }}.md"
          $files = Get-ChildItem artifacts -File | ForEach-Object { $_.FullName }
          $args = @('release', 'create', '${{ github.ref_name }}') + $files + @('--title', 'PackCheck ${{ github.ref_name }}')
          if (Test-Path $notes) { $args += @('--notes-file', $notes) } else { $args += '--generate-notes' }
          gh @args
